; Claude Buddy -- LVGL GUI firmware for the CYD (ESP32-2432S028).
; UI lives in src/ui.cpp and is also compiled on the host by preview/ to render PNGs.

[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
lib_deps =
    lvgl/lvgl @ 9.3.0
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bblanchon/ArduinoJson @ ^7.0.0
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DUSER_SETUP_LOADED=1
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_MISO=12
    -DTFT_BL=21
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=6000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DSPI_DMA_CHAN=1

; Original CYD: ILI9341, 240x320 portrait
[env:cyd]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
board_build.partitions = ${common.board_build.partitions}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

; New CYD/BYD variant (TPM408-2.8 / A2150): ILI9342, rotation 3 gives the same 240x320 portrait
[env:cyd_new]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
board_build.partitions = ${common.board_build.partitions}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DNEW_BOARD
    -DILI9342_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=240
